name: power_tracker_gh
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  intl_phone_number_input: ^0.7.4
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  geolocator: ^14.0.3
  connectivity_plus: ^7.3.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  rename: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/animations/bolt_animation.json
    - assets/icon.png
    - assets/google_g.png


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"